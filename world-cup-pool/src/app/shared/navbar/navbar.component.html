<nav class="navbar">
  <div class="nav-brand">🏆 Polla Mundialista</div>
  
  <div class="nav-links">
    @if (authService.isAuthenticated()) {
      <a routerLink="/dashboard" routerLinkActive="active">Fixture</a>
      <a routerLink="/leaderboard" routerLinkActive="active">Ranking</a>
      
      @if (authService.isAdmin()) {
        <a routerLink="/admin" routerLinkActive="active" class="admin-link">Panel Admin</a>
      }
      
      <button (click)="onLogout()" class="btn-logout">Cerrar Sesión</button>
    } @else {
      <a routerLink="/auth/login" routerLinkActive="active">Iniciar Sesión</a>
      <a routerLink="/auth/register" routerLinkActive="active">Registrarse</a>
    }
  </div>
</nav>
